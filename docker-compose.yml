version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: windsong-db
    restart: always
    environment:
      POSTGRES_USER: windsong
      POSTGRES_PASSWORD: windsong123
      POSTGRES_DB: windsong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windsong"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
