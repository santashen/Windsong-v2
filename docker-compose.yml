version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: windsong-db
    restart: always
    environment:
      POSTGRES_USER: windsong
      POSTGRES_PASSWORD: windsong123
      POSTGRES_DB: windsong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windsong"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10
    container_name: windsong-flyway-dev
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/windsong
      FLYWAY_USER: windsong
      FLYWAY_PASSWORD: windsong123
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
