version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16.14-alpine3.22
    container_name: windsong-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-windsong}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-windsong}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - windsong-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-windsong}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flyway 数据库迁移
  flyway:
    image: flyway/flyway:10
    container_name: windsong-flyway
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-windsong}
      FLYWAY_USER: ${DB_USER:-windsong}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - windsong-network

  # Go 后端 API
  backend:
    image: ccr.ccs.tencentyun.com/windsong/backend:latest
    container_name: windsong-backend
    restart: always
    environment:
      PORT: 8080
      DATABASE_URL: host=postgres user=${DB_USER:-windsong} password=${DB_PASSWORD} dbname=${DB_NAME:-windsong} port=5432 sslmode=disable
      ENV: production
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      PORTFOLIO_ACCESS_PASSWORD: ${PORTFOLIO_ACCESS_PASSWORD}
      POSTS_REPO_URL: ${POSTS_REPO_URL}
      POSTS_DIR: /root/data/posts
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - posts_data:/root/data/posts
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - windsong-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vue 前端（Nginx 网关容器）
  frontend:
    image: ccr.ccs.tencentyun.com/windsong/frontend:latest
    container_name: windsong-frontend
    restart: always
    ports:
      - "127.0.0.1:9081:80"  # 宿主机 9081 映射到容器 80
    networks:
      - windsong-network

  # Python AI 服务
  ai-service:
    image: ccr.ccs.tencentyun.com/windsong/ai-service:latest
    container_name: windsong-ai-service
    restart: always
    environment:
      DB_USER: ${DB_USER:-windsong}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-windsong}
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: host=postgres user=${DB_USER:-windsong} password=${DB_PASSWORD} dbname=${DB_NAME:-windsong} port=5432 sslmode=disable
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      PORTFOLIO_ACCESS_PASSWORD: ${PORTFOLIO_ACCESS_PASSWORD}
      LLM_API_URL: ${LLM_API_URL:-https://api.aaai.vip}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-r1-search}
      AKSHARE_PROXY_HOST: ${AKSHARE_PROXY_HOST:-101.201.173.125}
      AKSHARE_PROXY_TOKEN: ${AKSHARE_PROXY_TOKEN}
      AKSHARE_PROXY_RETRY: ${AKSHARE_PROXY_RETRY:-30}
      FAMILY_PORTFOLIO_SYNC_ENABLED: ${FAMILY_PORTFOLIO_SYNC_ENABLED:-true}
      FAMILY_PORTFOLIO_SYNC_HOUR: ${FAMILY_PORTFOLIO_SYNC_HOUR:-23}
      FAMILY_PORTFOLIO_SYNC_MINUTE: ${FAMILY_PORTFOLIO_SYNC_MINUTE:-0}
      FAMILY_PORTFOLIO_SYNC_TIMEZONE: ${FAMILY_PORTFOLIO_SYNC_TIMEZONE:-Asia/Shanghai}
      FAMILY_PORTFOLIO_BENCHMARK_SYMBOL: ${FAMILY_PORTFOLIO_BENCHMARK_SYMBOL:-sh000300}
      HOST: 0.0.0.0
      PORT: 8000
      ENV: production
    networks:
      - windsong-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  windsong-network:
    driver: bridge

volumes:
  postgres_data:
  posts_data:
