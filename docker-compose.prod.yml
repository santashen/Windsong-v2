version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16.14-alpine3.22
    container_name: windsong-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-windsong}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-windsong}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - windsong-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-windsong}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flyway 数据库迁移
  flyway:
    image: flyway/flyway:10
    container_name: windsong-flyway
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-windsong}
      FLYWAY_USER: ${DB_USER:-windsong}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - windsong-network

  # Python capability services (internal only)
  python:
    image: ccr.ccs.tencentyun.com/windsong/python:latest
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: windsong-python
    restart: always
    environment:
      LLM_API_URL: ${LLM_API_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-150}
    networks:
      - windsong-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Go 后端 API
  backend:
    image: ccr.ccs.tencentyun.com/windsong/backend:latest
    container_name: windsong-backend
    restart: always
    environment:
      PORT: 8080
      DATABASE_URL: host=postgres user=${DB_USER:-windsong} password=${DB_PASSWORD} dbname=${DB_NAME:-windsong} port=5432 sslmode=disable
      ENV: production
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      PYTHON_SERVICE_URL: http://python:8000
      PYTHON_SERVICE_TIMEOUT_SECONDS: ${PYTHON_SERVICE_TIMEOUT_SECONDS:-160}
      POSTS_REPO_URL: ${POSTS_REPO_URL}
      POSTS_DIR: /root/data/posts
      SITE_URL: ${SITE_URL:-https://v2.windsong.top}
      RSS_TITLE: ${RSS_TITLE:-Windsong Blog}
      RSS_DESCRIPTION: ${RSS_DESCRIPTION:-Windsong Blog RSS Feed}
      RSS_AUTHOR: ${RSS_AUTHOR:-}
      RSS_MAX_ITEMS: ${RSS_MAX_ITEMS:-20}
    volumes:
      - posts_data:/root/data/posts
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      python:
        condition: service_healthy
    networks:
      - windsong-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vue 前端（Nginx 网关容器）
  frontend:
    image: ccr.ccs.tencentyun.com/windsong/frontend:latest
    container_name: windsong-frontend
    restart: always
    ports:
      - "127.0.0.1:9081:80"  # 宿主机 9081 映射到容器 80
    networks:
      - windsong-network

networks:
  windsong-network:
    driver: bridge

volumes:
  postgres_data:
  posts_data:
