basePath: /api/v1
definitions:
  handlers.PhotoInput:
    properties:
      aspectRatio:
        maxLength: 20
        type: string
      city:
        maxLength: 100
        type: string
      country:
        maxLength: 100
        type: string
      date:
        type: string
      description:
        maxLength: 2000
        type: string
      location:
        maxLength: 200
        type: string
      tags:
        items:
          type: string
        maxItems: 20
        type: array
      thumbnail:
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
      url:
        type: string
    required:
    - date
    - title
    - url
    type: object
  handlers.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  handlers.VerifyRequest:
    properties:
      apiKey:
        type: string
    required:
    - apiKey
    type: object
  handlers.VerifyResponse:
    properties:
      message:
        type: string
      valid:
        type: boolean
    type: object
  models.FilterOptions:
    properties:
      locations:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      years:
        items:
          type: integer
        type: array
    type: object
  models.Pagination:
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  models.Photo:
    properties:
      aspectRatio:
        type: string
      city:
        type: string
      country:
        type: string
      createdAt:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: integer
      location:
        type: string
      tags:
        description: JSON array stored as string, e.g. ["nature","travel"]
        type: string
      thumbnail:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      url:
        type: string
    type: object
  models.PhotoResponse:
    properties:
      pagination:
        $ref: '#/definitions/models.Pagination'
      photos:
        items:
          $ref: '#/definitions/models.Photo'
        type: array
    type: object
  models.Post:
    properties:
      content:
        type: string
      createdAt:
        type: string
      date:
        type: string
      id:
        type: integer
      isPublished:
        type: boolean
      slug:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
    type: object
  models.PostListItem:
    properties:
      createdAt:
        type: string
      date:
        type: string
      id:
        type: integer
      isPublished:
        type: boolean
      slug:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
    type: object
  models.PostListResponse:
    properties:
      pagination:
        $ref: '#/definitions/models.Pagination'
      posts:
        items:
          $ref: '#/definitions/models.PostListItem'
        type: array
    type: object
  services.SyncResult:
    properties:
      created:
        type: integer
      deleted:
        type: integer
      errors:
        items:
          type: string
        type: array
      skipped:
        type: integer
      updated:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Personal blog system API with posts and photos.
  title: Windsong Blog API
  version: "1.0"
paths:
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Validates the provided API key for admin access
      parameters:
      - description: API key to verify
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/handlers.VerifyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Response'
      summary: Verify admin API key
      tags:
      - auth
  /photos:
    get:
      description: Returns paginated photos with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: pageSize
        type: integer
      - description: Filter by year
        in: query
        name: year
        type: integer
      - description: Filter by location
        in: query
        name: location
        type: string
      - description: Filter by tags (comma-separated)
        in: query
        name: tags
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.PhotoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.Response'
      summary: List photos
      tags:
      - photos
    post:
      consumes:
      - application/json
      description: Creates a new photo entry
      parameters:
      - description: Photo data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PhotoInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Photo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.Response'
      security:
      - ApiKeyAuth: []
      summary: Create a photo
      tags:
      - photos
  /photos/{id}:
    delete:
      description: Deletes a photo by ID
      parameters:
      - description: Photo ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.Response'
      security:
      - ApiKeyAuth: []
      summary: Delete a photo
      tags:
      - photos
    get:
      description: Returns a single photo by ID
      parameters:
      - description: Photo ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Photo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.Response'
      summary: Get a photo
      tags:
      - photos
    put:
      consumes:
      - application/json
      description: Updates an existing photo by ID
      parameters:
      - description: Photo ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PhotoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Photo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.Response'
      security:
      - ApiKeyAuth: []
      summary: Update a photo
      tags:
      - photos
  /photos/filters:
    get:
      description: Returns available filter options (years, locations, tags)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.FilterOptions'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.Response'
      summary: Get photo filter options
      tags:
      - photos
  /posts:
    get:
      description: Returns paginated blog posts with optional tag filter
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: pageSize
        type: integer
      - description: Filter by tag
        in: query
        name: tag
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.PostListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.Response'
      summary: List blog posts
      tags:
      - posts
  /posts/{slug}:
    get:
      description: Returns a single blog post by its slug
      parameters:
      - description: Post slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.Response'
      summary: Get a blog post
      tags:
      - posts
  /webhooks/sync:
    post:
      description: Triggers a sync of blog posts from the configured git repository
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.Response'
            - properties:
                data:
                  $ref: '#/definitions/services.SyncResult'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.Response'
      security:
      - ApiKeyAuth: []
      summary: Sync posts from git repository
      tags:
      - webhooks
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
