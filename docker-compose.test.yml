version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: windsong-db-test
    environment:
      POSTGRES_USER: windsong
      POSTGRES_PASSWORD: windsong123
      POSTGRES_DB: windsong
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - windsong-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windsong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go 后端 API（本地构建）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windsong-backend-test
    ports:
      - "127.0.0.1:9080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: host=postgres user=windsong password=windsong123 dbname=windsong port=5432 sslmode=disable
      ENV: production
      ADMIN_API_KEY: ${ADMIN_API_KEY:-test-admin-key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - windsong-test

  # Vue 前端（本地构建）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windsong-frontend-test
    ports:
      - "127.0.0.1:9081:80"
    networks:
      - windsong-test

  # 模拟全局 Nginx（可选，用于完整测试）
  nginx:
    image: nginx:alpine
    container_name: windsong-nginx-test
    ports:
      - "8080:80"
    volumes:
      - ./nginx/v2.windsong.top.test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - windsong-test

networks:
  windsong-test:
    driver: bridge

volumes:
  postgres_test_data:
