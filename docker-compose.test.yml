version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: windsong-db-test
    environment:
      POSTGRES_USER: windsong
      POSTGRES_PASSWORD: windsong123
      POSTGRES_DB: windsong
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - windsong-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windsong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flyway 数据库迁移
  flyway:
    image: flyway/flyway:10
    container_name: windsong-flyway-test
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/windsong
      FLYWAY_USER: windsong
      FLYWAY_PASSWORD: windsong123
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - windsong-test

  # Go 后端 API（本地构建）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windsong-backend-test
    environment:
      PORT: 8080
      DATABASE_URL: host=postgres user=windsong password=windsong123 dbname=windsong port=5432 sslmode=disable
      ENV: production
      ADMIN_API_KEY: ${ADMIN_API_KEY:-test-admin-key}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - windsong-test

  # Vue 前端（本地构建）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windsong-frontend-test
    ports:
      - "127.0.0.1:9081:80"
    networks:
      - windsong-test

  # Python AI 服务（本地构建）
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: windsong-ai-service-test
    environment:
      DB_USER: windsong
      DB_PASSWORD: windsong123
      DB_NAME: windsong
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: host=postgres user=windsong password=windsong123 dbname=windsong port=5432 sslmode=disable
      ADMIN_API_KEY: ${ADMIN_API_KEY:-test-admin-key}
      PORTFOLIO_ACCESS_PASSWORD: ${PORTFOLIO_ACCESS_PASSWORD:-test-portfolio-password}
      LLM_API_URL: ${LLM_API_URL:-https://api.aaai.vip}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-r1-search}
      AKSHARE_PROXY_HOST: ${AKSHARE_PROXY_HOST:-101.201.173.125}
      AKSHARE_PROXY_TOKEN: ${AKSHARE_PROXY_TOKEN}
      AKSHARE_PROXY_RETRY: ${AKSHARE_PROXY_RETRY:-30}
      FAMILY_PORTFOLIO_SYNC_ENABLED: ${FAMILY_PORTFOLIO_SYNC_ENABLED:-true}
      FAMILY_PORTFOLIO_SYNC_HOUR: ${FAMILY_PORTFOLIO_SYNC_HOUR:-23}
      FAMILY_PORTFOLIO_SYNC_MINUTE: ${FAMILY_PORTFOLIO_SYNC_MINUTE:-0}
      FAMILY_PORTFOLIO_SYNC_TIMEZONE: ${FAMILY_PORTFOLIO_SYNC_TIMEZONE:-Asia/Shanghai}
      FAMILY_PORTFOLIO_BENCHMARK_SYMBOL: ${FAMILY_PORTFOLIO_BENCHMARK_SYMBOL:-sh000300}
      HOST: 0.0.0.0
      PORT: 8000
      ENV: production
    networks:
      - windsong-test

  # 模拟全局 Nginx（可选，用于完整测试）
  nginx:
    image: nginx:alpine
    container_name: windsong-nginx-test
    ports:
      - "8080:80"
    volumes:
      - ./nginx/v2.windsong.top.test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - windsong-test

networks:
  windsong-test:
    driver: bridge

volumes:
  postgres_test_data:
