name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: windsong-backend
  FRONTEND_IMAGE: windsong-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送后端镜像
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/santashen/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/santashen/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建并推送前端镜像
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/santashen/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/santashen/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    # 【修复1】必须显式声明 deploy job 的权限，否则 GITHUB_TOKEN 无法读取包
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          # 【修复2】在这里列出变量名，使用大写更规范（GHCR_TOKEN, GHCR_USER）
          envs: DB_USER,DB_PASSWORD,DB_NAME,GHCR_TOKEN,GHCR_USER,ADMIN_API_KEY,POSTS_REPO_URL
          script: |
            cd /data/web-dockers/Windsong-v2

            # 拉取代码
            git fetch origin
            git reset --hard origin/develop

            # 生成 .env 文件
            echo "DB_USER=$DB_USER" > .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "DB_NAME=$DB_NAME" >> .env
            echo "ADMIN_API_KEY=$ADMIN_API_KEY" >> .env
            echo "POSTS_REPO_URL=$POSTS_REPO_URL" >> .env
            chmod 600 .env

            # 【修复3】使用传入的环境变量进行登录，确保变量加双引号
            # 建议先 logout 避免旧的凭证冲突
            docker logout ghcr.io || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # 拉取镜像 (使用小写的用户名，因为 Docker 镜像名必须小写)
            docker pull ghcr.io/santashen/windsong-backend:latest
            docker pull ghcr.io/santashen/windsong-frontend:latest

            # 重启容器
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d

            docker image prune -f
            echo "Deployment completed!"
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # 【修复4】将 Token 和 用户名 映射到环境变量
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          POSTS_REPO_URL: ${{ secrets.POSTS_REPO_URL }}