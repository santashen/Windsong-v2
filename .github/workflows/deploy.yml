name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      action:
        description: Manual action to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - build-backend
          - build-frontend
          - build-ai-service
          - build-all
      deploy_ref:
        description: Branch to deploy when action is deploy
        required: false
        default: develop
        type: string

env:
  # 1. 更换为腾讯云镜像仓库地址
  REGISTRY: ccr.ccs.tencentyun.com
  # 2. 腾讯云的命名空间 (刚才在控制台创建的)
  NAMESPACE: windsong
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend
  AI_SERVICE_IMAGE: ai-service

jobs:
  # 检测哪些目录有变化
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      shared: ${{ steps.filter.outputs.shared }}
      any-changed: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ai-service == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            ai-service:
              - 'ai-service/**'
              - '.github/workflows/deploy.yml'
            shared:
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'

  # 构建 backend 镜像（仅当 backend 目录有变化时）
  build-backend:
    needs: changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'build-backend' || github.event.inputs.action == 'build-all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CLOUD_USERNAME }}
          password: ${{ secrets.TENCENT_CLOUD_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.BACKEND_IMAGE }}:buildcache
            type=gha,scope=backend
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.BACKEND_IMAGE }}:buildcache,mode=max
            type=gha,scope=backend,mode=max

  # 构建 frontend 镜像（仅当 frontend 目录有变化时）
  build-frontend:
    needs: changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'build-frontend' || github.event.inputs.action == 'build-all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CLOUD_USERNAME }}
          password: ${{ secrets.TENCENT_CLOUD_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:buildcache
            type=gha,scope=frontend
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:buildcache,mode=max
            type=gha,scope=frontend,mode=max

  # 构建 ai-service 镜像（仅当 ai-service 目录有变化时）
  build-ai-service:
    needs: changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (needs.changes.outputs.ai-service == 'true' || needs.changes.outputs.shared == 'true')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'build-ai-service' || github.event.inputs.action == 'build-all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CLOUD_USERNAME }}
          password: ${{ secrets.TENCENT_CLOUD_PASSWORD }}

      - name: Build and push ai-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.AI_SERVICE_IMAGE }}:latest
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.AI_SERVICE_IMAGE }}:buildcache
            type=gha,scope=ai-service
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.AI_SERVICE_IMAGE }}:buildcache,mode=max
            type=gha,scope=ai-service,mode=max

  deploy:
    needs: [changes, build-backend, build-frontend, build-ai-service]
    runs-on: ubuntu-latest
    # 只要本次 workflow 没有失败或取消，就始终执行部署
    if: |
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: DB_USER,DB_PASSWORD,DB_NAME,TENCENT_USER,TENCENT_PWD,ADMIN_API_KEY,PORTFOLIO_ACCESS_PASSWORD,POSTS_REPO_URL,LLM_API_URL,LLM_API_KEY,LLM_MODEL,AKSHARE_PROXY_HOST,AKSHARE_PROXY_TOKEN,AKSHARE_PROXY_RETRY,REGISTRY,NAMESPACE,DEPLOY_REF
          script: |
            cd /data/web-dockers/Windsong-v2

            git fetch origin
            git reset --hard origin/$DEPLOY_REF

            # 生成 .env
            echo "DB_USER=$DB_USER" > .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "DB_NAME=$DB_NAME" >> .env
            echo "ADMIN_API_KEY=$ADMIN_API_KEY" >> .env
            echo "PORTFOLIO_ACCESS_PASSWORD=$PORTFOLIO_ACCESS_PASSWORD" >> .env
            echo "POSTS_REPO_URL=$POSTS_REPO_URL" >> .env
            echo "LLM_API_URL=$LLM_API_URL" >> .env
            echo "LLM_API_KEY=$LLM_API_KEY" >> .env
            echo "LLM_MODEL=$LLM_MODEL" >> .env
            echo "AKSHARE_PROXY_HOST=$AKSHARE_PROXY_HOST" >> .env
            echo "AKSHARE_PROXY_TOKEN=$AKSHARE_PROXY_TOKEN" >> .env
            echo "AKSHARE_PROXY_RETRY=$AKSHARE_PROXY_RETRY" >> .env
            chmod 600 .env

            # 登录腾讯云仓库
            echo "$TENCENT_PWD" | docker login $REGISTRY -u "$TENCENT_USER" --password-stdin

            # 每次都重新拉取镜像
            docker compose -f docker-compose.prod.yml pull

            # Flyway 镜像（使用国内镜像加速）
            docker pull m.daocloud.io/docker.io/flyway/flyway:10 || docker pull flyway/flyway:10

            # 每次都重新部署
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            docker image prune -f
            echo "Deployment completed!"
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          TENCENT_USER: ${{ secrets.TENCENT_CLOUD_USERNAME }}
          TENCENT_PWD: ${{ secrets.TENCENT_CLOUD_PASSWORD }}
          REGISTRY: ${{ env.REGISTRY }}
          NAMESPACE: ${{ env.NAMESPACE }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.ref_name }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          PORTFOLIO_ACCESS_PASSWORD: ${{ secrets.PORTFOLIO_ACCESS_PASSWORD }}
          POSTS_REPO_URL: ${{ secrets.POSTS_REPO_URL }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          AKSHARE_PROXY_HOST: ${{ secrets.AKSHARE_PROXY_HOST }}
          AKSHARE_PROXY_TOKEN: ${{ secrets.AKSHARE_PROXY_TOKEN }}
          AKSHARE_PROXY_RETRY: ${{ secrets.AKSHARE_PROXY_RETRY }}
