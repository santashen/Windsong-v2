name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  # 1. 更换为腾讯云镜像仓库地址
  REGISTRY: ccr.ccs.tencentyun.com
  # 2. 腾讯云的命名空间 (刚才在控制台创建的)
  NAMESPACE: windsong
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend
  AI_SERVICE_IMAGE: ai-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到腾讯云镜像仓库
      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CLOUD_USERNAME }}
          password: ${{ secrets.TENCENT_CLOUD_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ai-service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.AI_SERVICE_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.AI_SERVICE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          # 4. 传入腾讯云的凭证
          envs: DB_USER,DB_PASSWORD,DB_NAME,TENCENT_USER,TENCENT_PWD,ADMIN_API_KEY,POSTS_REPO_URL,LLM_API_URL,LLM_API_KEY,LLM_MODEL,REGISTRY,NAMESPACE
          script: |
            cd /data/web-dockers/Windsong-v2

            git fetch origin
            git reset --hard origin/develop

            # 生成 .env
            echo "DB_USER=$DB_USER" > .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "DB_NAME=$DB_NAME" >> .env
            echo "ADMIN_API_KEY=$ADMIN_API_KEY" >> .env
            echo "POSTS_REPO_URL=$POSTS_REPO_URL" >> .env
            echo "LLM_API_URL=$LLM_API_URL" >> .env
            echo "LLM_API_KEY=$LLM_API_KEY" >> .env
            echo "LLM_MODEL=$LLM_MODEL" >> .env
            chmod 600 .env

            # 5. 在服务器上登录腾讯云仓库
            echo "$TENCENT_PWD" | docker login $REGISTRY -u "$TENCENT_USER" --password-stdin

            # 6. 拉取腾讯云上的镜像
            docker pull $REGISTRY/$NAMESPACE/backend:latest
            docker pull $REGISTRY/$NAMESPACE/frontend:latest
            docker pull $REGISTRY/$NAMESPACE/ai-service:latest
            # Flyway 如果拉取也慢，建议也转存到腾讯云，或者使用国内镜像源
            docker pull flyway/flyway:10 || docker pull m.daocloud.io/docker.io/flyway/flyway:10

            # 重启容器
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            docker image prune -f
            echo "Deployment completed!"
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # 映射腾讯云凭证
          TENCENT_USER: ${{ secrets.TENCENT_CLOUD_USERNAME }}
          TENCENT_PWD: ${{ secrets.TENCENT_CLOUD_PASSWORD }}
          REGISTRY: ${{ env.REGISTRY }}
          NAMESPACE: ${{ env.NAMESPACE }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          POSTS_REPO_URL: ${{ secrets.POSTS_REPO_URL }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}