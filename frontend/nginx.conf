server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. 全局配置：性能与压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    # 2. 静态资源缓存（直接在网关层处理）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. 特殊逻辑：Webhook 同步（从宿主机搬过来的）
    location /api/v1/webhooks/sync {
        set $real_key $http_x_api_key;
        if ($real_key = "") {
            set $real_key $http_x_gitee_token;
        }
        proxy_set_header X-API-KEY $real_key;
        
        proxy_pass http://windsong-backend:8080;
    }

    # 4. 通用 Go 后端 API
    location /api/ {
        proxy_pass http://windsong-backend:8080;
        proxy_read_timeout 180s;
        
        # 基础 proxy 参数
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 5. AI 服务转发（带长超时和流式输出优化）
    location /ai-api/ {
        # 注意这里的路径重写逻辑，根据你的 FastAPI 实际路由调整
        proxy_pass http://windsong-ai-service:8000/api/; 
        
        proxy_read_timeout 300s; 
        proxy_cache off;
        proxy_buffering off; # 关键：支持 AI 流式输出 (SSE)
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Vue Router 支持
    location / {
        try_files $uri $uri/ /index.html;
    }
}